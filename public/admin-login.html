<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Social Hub | Admin Login</title>
  <link rel="stylesheet" href="/style.css"><script src="/admin-login.js" defer></script>
</head>
<body>
<div class="shell">
  <header class="topbar"><span class="brand">◈ <span>Social Hub</span></span><span class="chip">PRIVATE ADMIN ACCESS</span></header>
  <main class="admin-gate-wrap">
    <section class="login-card admin-gate" aria-labelledby="gate-title">
      <div class="card-symbol" aria-hidden="true">◈</div>
      <span class="section-kicker">ADMIN ACCESS</span>
      <h1 id="gate-title">دخول الإدارة</h1>
      <p class="muted">هذه الواجهة مخصّصة لمدير نسخة الاختبار فقط. رمز الإدارة منفصل تمامًا عن بيانات المشاركين.</p>
      <form id="admin-login-form">
        <label for="admin-token">رمز الأدمن (ADMIN_TOKEN)</label>
        <input id="admin-token" type="password" autocomplete="off" required placeholder="الرمز الموجود في Terminal">
        <button class="primary-button full-width" type="submit">فتح لوحة الإدارة ←</button>
        <p id="gate-status" class="status" role="status" aria-live="polite"></p>
      </form>
      <p class="field-hint">في التشغيل المحلي يظهر رمز مؤقت في Terminal. يمكنك تحديد رمز ثابت عبر متغير البيئة ADMIN_TOKEN.</p>
    </section>
  </main>
  <footer class="footer">Social Hub Demo · صفحة إدارة خاصة</footer>
</div>
</body>
</html>
